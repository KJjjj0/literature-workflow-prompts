name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate distribution
        run: |
          python tools/sync_hosts.py --check
          python tools/validate_distribution.py

      - name: Run tests
        run: python -B -m unittest discover -s plugins/ai-literature-workflow/tests -v
